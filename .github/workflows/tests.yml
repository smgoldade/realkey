name: Tests

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-tests:
    name: Geometry tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
